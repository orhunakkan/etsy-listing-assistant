<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stagecraft Labs</title>
    <meta name="description" content="Something new is being staged." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #fafaf9;
        --text: #1c1917;
        --muted: #57534e;
        --accent: #4f46e5;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --accent: #818cf8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      .mark {
        width: 40px;
        height: 4px;
        margin: 0 auto 24px;
        border-radius: 2px;
        background: var(--accent);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Stagecraft Labs</h1>
      <p>Something new is being staged. Check back soon.</p>
    </main>
  </body>
</html>
