name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3001/health && exit 0
            sleep 0.5
          done
          echo "Server did not become healthy" >&2
          exit 1

      - name: Security audit
        run: npm audit --audit-level=high

  deploy-azure:
    name: Deploy to Azure App Service
    runs-on: windows-latest
    timeout-minutes: 15
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Azure deployment secrets
        shell: pwsh
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_NAME)) {
            throw "Missing GitHub repository secret: AZURE_WEBAPP_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_PUBLISH_PROFILE)) {
            throw "Missing GitHub repository secret: AZURE_WEBAPP_PUBLISH_PROFILE"
          }

      - name: Build Azure App Service package
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          # The app has no runtime dependencies, so the package is just the
          # manifests plus the built server and the static client files.
          $staging = ".azure-publish/appservice"
          New-Item -ItemType Directory -Force -Path "$staging/client", "$staging/server" | Out-Null
          Copy-Item package.json -Destination $staging
          Copy-Item client/package.json, client/index.html -Destination "$staging/client"
          Copy-Item server/package.json -Destination "$staging/server"
          Copy-Item server/dist -Destination "$staging/server/dist" -Recurse
          Compress-Archive -Path "$staging/*" -DestinationPath ".azure-publish/stagecraft-appservice.zip" -Force

      - name: Deploy ZIP package
        shell: pwsh
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          $packagePath = ".azure-publish/stagecraft-appservice.zip"
          if (-not (Test-Path -LiteralPath $packagePath)) {
            throw "Deployment package was not found: $packagePath"
          }

          [xml]$publishProfile = $env:AZURE_WEBAPP_PUBLISH_PROFILE
          $profile = $publishProfile.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq "ZipDeploy" } |
            Select-Object -First 1

          if (-not $profile) {
            throw "Publish profile does not contain ZipDeploy credentials."
          }

          $credentials = "$($profile.userName):$($profile.userPWD)"
          $encodedCredentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          $headers = @{ Authorization = "Basic $encodedCredentials" }
          $deployUri = "https://$($profile.publishUrl.TrimEnd('/'))/api/zipdeploy?isAsync=true"

          Write-Host "Uploading deployment ZIP to Azure App Service..."
          $response = Invoke-WebRequest `
            -Method Post `
            -Uri $deployUri `
            -Headers $headers `
            -InFile $packagePath `
            -ContentType "application/zip"

          $statusUri = @($response.Headers.Location)[0]
          if (-not $statusUri) {
            Write-Host "Azure accepted the deployment request."
            return
          }

          do {
            Start-Sleep -Seconds 5
            $status = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
            Write-Host "Deployment status: $($status.status_text)"
          } while ($status.status -lt 3)

          if ($status.status -ne 4) {
            throw "Azure deployment failed: $($status.status_text)"
          }

          Write-Host "Azure deployment completed."
